[build]
  publish = "."

[[redirects]]
  from = "/dashboard"
  to   = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/transactions"
  to   = "/transactions.html"
  status = 200

[[redirects]]
  from = "/goals"
  to   = "/goals.html"
  status = 200

[[redirects]]
  from = "/split"
  to   = "/split.html"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/login.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
