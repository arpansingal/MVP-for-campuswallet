<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — CampusWallet</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><span>💰</span><span class="logo-text">CampusWallet</span></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <a class="nav-item active" href="transactions.html"><span class="nav-icon">💸</span> Expenses</a>
      <a class="nav-item" href="goals.html"><span class="nav-icon">🎯</span> Savings Goals</a>
      <a class="nav-item" href="split.html"><span class="nav-icon">👥</span> Split Bills</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="sidebarAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebarName">Loading...</div>
          <div class="user-email" id="sidebarEmail"></div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm logout-btn-full" onclick="signOut()">
        <span>🚪</span> Log Out
      </button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <main class="main-content">
    <header class="app-header">
      <div class="app-header-left">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <div class="page-title">Expenses</div>
          <div class="page-subtitle">Track every rupee you spend</div>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openModal()">+ Add Expense</button>
    </header>

    <div class="page-body">
      <!-- Month + Filter -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px;">
        <div class="month-selector">
          <button class="month-btn" onclick="changeMonth(-1)">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button class="month-btn" onclick="changeMonth(1)">›</button>
        </div>
        <div class="filter-bar" style="margin-bottom:0;">
          <div class="filter-chip active" data-cat="all" onclick="setFilter('all')">All</div>
          <div class="filter-chip" data-cat="food" onclick="setFilter('food')">🍕 Food</div>
          <div class="filter-chip" data-cat="rent" onclick="setFilter('rent')">🏠 Rent</div>
          <div class="filter-chip" data-cat="books" onclick="setFilter('books')">📚 Books</div>
          <div class="filter-chip" data-cat="transport" onclick="setFilter('transport')">🚌 Transport</div>
          <div class="filter-chip" data-cat="entertainment" onclick="setFilter('entertainment')">🎬 Fun</div>
          <div class="filter-chip" data-cat="health" onclick="setFilter('health')">💊 Health</div>
          <div class="filter-chip" data-cat="other" onclick="setFilter('other')">📦 Other</div>
        </div>
      </div>

      <!-- Summary strip -->
      <div id="summaryStrip" style="margin-bottom:20px;"></div>

      <!-- Expense list -->
      <div class="card" style="padding:0;overflow:hidden;">
        <div id="expenseList" style="min-height:200px;">
          <div class="page-loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Expense Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Add Expense</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <form id="expenseForm" onsubmit="handleSubmit(event)" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label class="form-label">Amount (₹)</label>
        <input type="number" class="form-input" id="fAmount" placeholder="0" min="1" step="0.01" required>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="fCategory" required>
          <option value="">Select category</option>
          <option value="food">🍕 Food</option>
          <option value="rent">🏠 Rent</option>
          <option value="books">📚 Books</option>
          <option value="transport">🚌 Transport</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="health">💊 Health</option>
          <option value="other">📦 Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <input type="text" class="form-input" id="fDesc" placeholder="e.g. Canteen lunch">
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" class="form-input" id="fDate" required>
      </div>
      <div style="display:flex;gap:10px;">
        <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1;" id="submitBtn">Add Expense</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-header">
      <h3 class="modal-title">Delete Expense?</h3>
      <button class="modal-close" onclick="closeDeleteModal()">×</button>
    </div>
    <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:24px;">This action cannot be undone.</p>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn btn-danger" style="flex:1;" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
